name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Configure Android SDK/NDK and build APK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_NDK_ROOT="$(ls -d ${ANDROID_SDK_ROOT}/ndk/* | sort -V | tail -n 1)"
          echo "SDK: $ANDROID_SDK_ROOT"
          echo "NDK: $ANDROID_NDK_ROOT"
          keytool -genkeypair -v -keystore release.keystore -alias bandleharvest -keyalg RSA -keysize 2048 -validity 10000 -storepass bandleharvest -keypass bandleharvest -dname "CN=Bandle Harvest, O=Bandle Harvest, C=BR"
          cargo apk build --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bandle-Harvest-Android-0.1.3-arm64
          path: target/release/apk/*.apk
