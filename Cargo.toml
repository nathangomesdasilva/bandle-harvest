[package]
name = "bandle_harvest"
version = "0.1.3"
edition = "2024"
description = "Protótipo de fazenda 2D em Rust e Bevy, com conteúdo fan-made de Yordles"

[lib]
name = "bandle_harvest"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bandle_harvest"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "default_font",
    "bevy_winit",
    "2d_bevy_render",
    "ui_bevy_render",
    "android-native-activity",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["x11"] }

[package.metadata.android]
package = "com.bandleharvest.app"
apk_name = "Bandle-Harvest-Android-0.1.3-arm64"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Bandle Harvest"

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "landscape"
[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "bandleharvest"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
